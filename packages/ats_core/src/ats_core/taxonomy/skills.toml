# Bilingual skill taxonomy.
#
# Fields
#   id          stable identifier (snake_case, unique)
#   name        display name
#   category    grouping for reports
#   aliases     English / Latin-script spellings, matched case-insensitively.
#               A space also matches a hyphen or several spaces ("full stack" = "full-stack").
#   exact_case  spellings that are ordinary English words in lower case, so they
#               only count when written exactly like this ("Go", "React", "Excel").
#   aliases_th  Thai spellings, matched on PyThaiNLP word boundaries.
#
# Every alias must map to exactly one skill; the loader rejects duplicates.

