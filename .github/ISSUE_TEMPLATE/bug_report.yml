name: Bug report
description: Something does not work as expected
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: "Do not paste API keys, tokens or real resume content. Redact them first."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Actual vs expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      render: text
  - type: input
    id: version
    attributes:
      label: Version / commit
